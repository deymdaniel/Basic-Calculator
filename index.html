<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="/script.js" defer></script>

    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>CALCULATOR</h1>
    <div class="calculatorBody">
      <div class="row1">
        <span class="output"></span><span class="input"></span>
      </div>
      <div class="row2">
        <button class="clear">C</button><button class="delete">DEL</button>
      </div>
      <div class="row3">
        <button class="num">7</button><button class="num">8</button
        ><button class="num">9</button><button class="operation">/</button>
      </div>
      <div class="row4">
        <button class="num">4</button><button class="num">5</button
        ><button class="num">6</button><button class="operation">-</button>
      </div>
      <div class="row5">
        <button class="num">1</button><button class="num">2</button
        ><button class="num">3</button><button class="operation">+</button>
      </div>
      <div class="row6">
        <button>.</button><button class="num">0</button
        ><button class="equal">=</button><button class="operation">*</button>
      </div>
    </div>
  </body>
</html>
